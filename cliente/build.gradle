plugins {
    id 'com.android.application'
}
android {
    namespace 'br.com.lucasmoraes.cliente'
    compileSdk 34
    defaultConfig {
        applicationId 'br.com.lucasmoraes.cliente'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
